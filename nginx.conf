server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy Meilisearch API — Authorization header added server-side via Docker secret.
    # /run/secrets/meili_auth_header contains a single nginx directive:
    #   proxy_set_header Authorization "Bearer <key>";
    # nginx includes it natively; no scripts, no env vars, key never reaches the browser.
    location /meili/ {
        proxy_pass        http://hiss-meilisearch:7700/;
        include           /run/secrets/meili_auth_header;
        proxy_set_header  Host $http_host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_hide_header Server;

        limit_except POST GET {
            deny all;
        }
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
